<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Plume</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/plume-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/plume-app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/plume-apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        var t = localStorage.getItem('plume-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
