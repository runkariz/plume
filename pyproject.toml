[project]
name = "plume"
version = "0.1.0"
description = "API documentation knowledge base: immutable builds of API docs in Postgres + pgvector, served to Claude over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.9",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
plume = "plume.bootstrap.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plume"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT", "TID", "S", "C4", "PL"]
# PLR0913/PLR0917: constructors take their ports (dependency injection).
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "PLR2004"]
"src/plume/infrastructure/db/migrations/**" = ["N999"]
"src/plume/interfaces/cli/main.py" = ["PLR0915"]  # one Typer app factory with nested commands
"src/plume/interfaces/http/app.py" = ["PLR0915"]  # one FastAPI app factory with nested routes
"src/plume/interfaces/mcp/*_server.py" = ["PLR0915"]  # one MCP server factory with nested tools

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs Docker (testcontainers); run by `make test-int`",
    "e2e: needs the docker compose stack; run by `make e2e`",
    "eval: release gate (gold questions); run by `make eval`",
    "live: calls a real external service (Gemini/Vertex); skipped without PLUME_VERTEX_API_KEY",
    "claude_live: runs Claude Code headless against a running stack (opt-in, PLUME_L2_RUN=1)",
]

[tool.coverage.run]
source = ["plume"]
branch = true
