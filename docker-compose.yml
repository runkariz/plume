# Local stack. Plume's port block is 18400-18499 (Postgres 18432, API 18480, MCP 18481, web 18473).
# Host ports can be moved with PLUME_PG_HOST_PORT / PLUME_API_HOST_PORT / PLUME_MCP_HOST_PORT
# (make e2e runs as project plume-e2e on 18434 / 18484 / 18485 so it never collides).
name: plume

x-plume-env: &plume-env
  PLUME_DATABASE_URL: postgresql+psycopg://plume:plume@postgres:5432/plume
  PLUME_EMBEDDER: ${PLUME_EMBEDDER:-hash}
  PLUME_VERTEX_API_KEY: ${PLUME_VERTEX_API_KEY:-}
  PLUME_GEMINI_API_KEY: ${PLUME_GEMINI_API_KEY:-}
  PLUME_MCP_HOST: 0.0.0.0
  PLUME_MCP_ALLOWED_HOSTS: '["127.0.0.1:*","localhost:*","mcp:*"]'
  # Maintainer API tokens as a JSON list; empty = maintainer API answers 503.
  PLUME_MAINTAINER_TOKENS: ${PLUME_MAINTAINER_TOKENS:-[]}
  PLUME_GOLD_DIRS: '["/gold"]'
  PLUME_DATA_DIR: /data

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: plume
      POSTGRES_PASSWORD: plume
      POSTGRES_DB: plume
    ports:
      - "127.0.0.1:${PLUME_PG_HOST_PORT:-18432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plume -d plume"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    build: .
    image: plume:dev
    environment: *plume-env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: plume:dev
    environment: *plume-env
    command: ["serve", "--host", "0.0.0.0", "--port", "18480"]
    ports:
      - "127.0.0.1:${PLUME_API_HOST_PORT:-18480}:18480"
    volumes:
      - plumedata:/data
      - ${PLUME_GOLD_DIR:-./tests/fixtures/gold}:/gold:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    image: plume:dev
    environment: *plume-env
    command: ["mcp", "--host", "0.0.0.0", "--port", "18481"]
    ports:
      - "127.0.0.1:${PLUME_MCP_HOST_PORT:-18481}:18481"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 18481), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  plumedata:
